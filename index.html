<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDCI Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2L2 7V17L12 22L22 17V7L12 2Z' stroke='%2300D9FF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M2 7L12 12L22 7' stroke='%2300D9FF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12 12V22' stroke='%2300D9FF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M7 4.5L17 9.5' stroke='%2300D9FF' stroke-opacity='0.6' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'gray-900': '#0A0E27', // Deep Space
              'gray-800': '#1C2833',
              'gray-700': '#2C3E50',
              'gray-600': '#566573',
              'gray-400': '#B0B8C8', // Soft Gray
              'gray-200': '#FFFFFF', // Pure White
              'accent-green': '#00FF88', // Neon Green
              'accent-blue': '#00D9FF', // Electric Blue
              'accent-red': '#FF0080', // Hot Pink
              'must-buy': 'rgba(0, 255, 136, 0.1)',
              'high-conviction': 'rgba(0, 217, 255, 0.1)',
              'on-radar': 'rgba(176, 184, 200, 0.1)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
    <style>
      @keyframes gradient-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes scroll-left {
        from { transform: translateX(0%); }
        to { transform: translateX(-100%); }
      }
      .animate-scroll-left {
        animation: scroll-left 90s linear infinite;
      }
      .ticker-container:hover .animate-scroll-left {
        animation-play-state: paused;
      }
       @keyframes flash-green {
        from { background-color: rgba(0, 255, 136, 0.3); }
        to { background-color: transparent; }
      }
      .flash-green {
        animation: flash-green 0.7s ease-out;
      }
      @keyframes flash-red {
        from { background-color: rgba(255, 0, 128, 0.3); }
        to { background-color: transparent; }
      }
      .flash-red {
        animation: flash-red 0.7s ease-out;
      }
      @keyframes pulse-border {
        0%, 100% { box-shadow: 0 0 10px 2px rgba(0, 255, 136, 0.7); }
        50% { box-shadow: 0 0 15px 5px rgba(0, 255, 136, 0.3); }
      }
      .animate-pulse-border {
        animation: pulse-border 2.5s infinite ease-in-out;
      }
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1) translate(-50%, -50%); opacity: 1; }
        50% { transform: scale(1.5) translate(-50%, -50%); opacity: 0.7; }
      }
      .animate-pulse-dot {
        animation: pulse-dot 2.5s infinite ease-in-out;
      }
       @keyframes glow {
        0%, 100% { box-shadow: 0 0 8px 2px rgba(0, 217, 255, 0.6); }
        50% { box-shadow: 0 0 12px 4px rgba(0, 217, 255, 0.3); }
      }
      .animate-glow {
        animation: glow 2.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 12px 3px rgba(0, 255, 136, 1); transform: scale(1.05); }
        50% { box-shadow: 0 0 20px 7px rgba(0, 255, 136, 0.5); transform: scale(1); }
      }
      .animate-pulse-strong {
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes subtle-glow-red {
        0%, 100% { box-shadow: 0 0 6px 1px rgba(255, 0, 128, 0.5); }
        50% { box-shadow: 0 0 10px 3px rgba(255, 0, 128, 0.2); }
      }
      .animate-subtle-glow-red {
        animation: subtle-glow-red 3s infinite ease-in-out;
      }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(-45deg, #0A0E27, #1E0A3C, #001F3F, #0A3D2C);
        background-size: 400% 400%;
        animation: gradient-animation 30s ease infinite;
        color: #FFFFFF;
      }
      .glass-panel {
        background: rgba(28, 40, 51, 0.5); /* Semi-transparent base */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .glass-panel:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
      }
       /* High-Visibility Button System */
      .btn {
        padding: 0.5rem 1.25rem;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.2s ease-in-out;
        border: 2px solid transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
      }
      .btn-primary {
        background-color: #00D9FF; /* accent-blue */
        color: #0A0E27;
        box-shadow: 0 4px 14px 0 rgba(0, 217, 255, 0.39);
      }
      .btn-primary:hover:not(:disabled) {
        background-color: #33e1ff;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px 0 rgba(0, 217, 255, 0.45);
      }
      .btn-primary:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow: 0 2px 8px 0 rgba(0, 217, 255, 0.3);
      }
      .btn-secondary {
        background-color: transparent;
        color: #00D9FF;
        border-color: #00D9FF;
      }
      .btn-secondary:hover:not(:disabled) {
        background-color: rgba(0, 217, 255, 0.1);
        color: #fff;
      }
      .btn-success {
        background-color: #00FF88; /* accent-green */
        color: #0A0E27;
        box-shadow: 0 4px 14px 0 rgba(0, 255, 136, 0.39);
      }
      .btn-success:hover:not(:disabled) {
        background-color: #33ff9d;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px 0 rgba(0, 255, 136, 0.45);
      }
      .btn-success:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow: 0 2px 8px 0 rgba(0, 255, 136, 0.3);
      }
      .btn-danger {
        background-color: transparent;
        color: #FF0080; /* accent-red */
        border-color: #FF0080;
      }
      .btn-danger:hover:not(:disabled) {
        background-color: rgba(255, 0, 128, 0.1);
        color: #fff;
      }
      .btn-ghost {
        background-color: transparent;
        color: #B0B8C8; /* gray-400 */
        padding: 0.5rem;
        border-color: transparent;
      }
      .btn-ghost:hover:not(:disabled) {
        background-color: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
       .btn-ghost-success {
        background-color: transparent;
        color: #B0B8C8;
        padding: 0.5rem;
        border-color: transparent;
      }
      .btn-ghost-success:hover:not(:disabled) {
        background-color: rgba(0, 255, 136, 0.1);
        color: #00FF88;
      }
      .btn-ghost-danger {
        background-color: transparent;
        color: #B0B8C8;
        padding: 0.25rem;
        border-color: transparent;
      }
      .btn-ghost-danger:hover:not(:disabled) {
        background-color: rgba(255, 0, 128, 0.1);
        color: #FF0080;
      }
       /* For Webkit browsers like Chrome, Safari */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 14, 39, 0.5); /* Deep Space transparent */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #566573;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B0B8C8;
      }
    </style>
